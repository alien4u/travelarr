# Runs the unit tests, then publishes ghcr.io/alien4u/travelarr:
#   main      -> :latest (the only tag that moves; only pushes that change src/ or this file run, so a docs commit
#                never shows as an update)
#   tag vX.Y.Z -> :X.Y.Z (must match VERSION in src/app/main.py; never overwritten; tag pushes ignore paths)
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["src/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Whole runs per ref, one at a time. A newer push replaces a run still waiting, so on main the newest commit always
# runs last, and the tip check below stops an older run from moving latest past a newer change to src/.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/alien4u/travelarr
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7
      - name: Pick the tag
        id: tag
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' src/app/main.py)
          if [ -z "$version" ]; then echo "::error::VERSION not found in src/app/main.py"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version"; exit 1
            fi
            echo "tag=$version" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r src/requirements.txt -r src/requirements-dev.txt
          cd src && /tmp/venv/bin/python -m unittest tests.test_app
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        # every platform is built before anything is pushed; Push reuses this build from the builder's cache
        run: |
          docker buildx build --platform "$PLATFORMS" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="${{ steps.tag.outputs.version }}" \
            -t "$IMAGE:${{ steps.tag.outputs.tag }}" src
      - name: Push
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # 200: the version exists already, 404: free; anything else stops the release
            bearer=$(curl -fsS -u "$GITHUB_ACTOR:$TOKEN" \
              "https://ghcr.io/token?scope=repository:alien4u/travelarr:pull" | jq -r .token)
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $bearer" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/alien4u/travelarr/manifests/$tag")
            case "$code" in
              200) echo "::error::$IMAGE:$tag already exists; version tags are never overwritten"; exit 1 ;;
              404) ;;
              *) echo "::error::could not check whether $IMAGE:$tag exists (HTTP $code)"; exit 1 ;;
            esac
          else
            tip=$(git ls-remote origin refs/heads/main | cut -f1)
            if ! [[ "$tip" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::could not read the tip of main"; exit 1
            fi
            # a newer commit that only changes docs has no run of its own, so this one still publishes
            if [ "$tip" != "$GITHUB_SHA" ]; then
              git fetch -q --depth=1 origin "$tip"
              if ! git diff --quiet "$GITHUB_SHA" "$tip" -- src .github/workflows/image.yml; then
                echo "main moved on to $tip; its own run publishes latest"; exit 0
              fi
            fi
          fi
          docker buildx build --platform "$PLATFORMS" --push \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="${{ steps.tag.outputs.version }}" \
            -t "$IMAGE:$tag" src
